name: quakeroute_mobile
description: "QuakeRoute — Risk-aware post-earthquake navigation (Flutter mobile client)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Core — networking & state
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_dotenv: ^5.2.1

  # Navigation
  go_router: ^14.8.1

  # Map & location
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^13.0.4

  # Media
  image_picker: ^1.1.2

  # Theming
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env.example
    - assets/images/
    - assets/icons/
